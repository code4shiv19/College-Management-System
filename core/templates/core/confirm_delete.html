{% extends "core/base.html" %}
{% block title %}{{ title }} · CampusHub{% endblock %}
{% block content %}
<div class="row justify-content-center py-5"><div class="col-md-7 col-lg-5"><div class="card-modern p-4 text-center reveal"><div class="stat-icon mx-auto mb-3" style="background:#fef2f2;color:#dc2626"><i class="bi bi-trash3"></i></div><h3 class="section-title">{{ title }}?</h3><p class="muted">You are about to permanently remove <strong>{{ object }}</strong>. This action cannot be undone.</p><form method="post" class="d-flex justify-content-center gap-2 mt-4">{% csrf_token %}{% if back_args %}<a href="{% url back_url back_args.0 %}" class="btn btn-light rounded-pill px-4">Cancel</a>{% else %}<a href="{% url back_url %}" class="btn btn-light rounded-pill px-4">Cancel</a>{% endif %}<button class="btn btn-danger rounded-pill px-4" type="submit"><i class="bi bi-trash3 me-1"></i>Remove</button></form></div></div></div>
{% endblock %}
